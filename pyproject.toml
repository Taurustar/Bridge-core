[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-core-engine"
version = "0.3.0"
description = "Self-hosted backend for a persistent character companion (single-owner, Tailscale-only)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "redis>=5",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["core", "core.routes"]

[tool.setuptools.package-data]
core = ["emotions.json", "static_lines.json"]
